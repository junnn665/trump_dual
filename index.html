<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0f24">
  <title>トランプ・デュエル</title>
  <meta name="description" content="トランプ1組で遊ぶデュエマ風カードバトル。シールドをブレイクしてダイレクトアタックを決めろ！">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="トランプデュエル">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bg"><span>♠</span><span>♥</span><span>♦</span><span>♣</span><span>♠</span><span>♥</span><span>♦</span><span>♣</span><span>★</span></div>

  <!-- ===== タイトル ===== -->
  <section id="title" class="screen active">
    <div class="title-inner">
      <div class="logo">
        <div class="logo-suits"><i class="s">♠</i><i class="h">♥</i><i class="d">♦</i><i class="c">♣</i></div>
        <h1><span>TRUMP</span><span>DUEL</span></h1>
        <p class="logo-ja">トランプ・デュエル</p>
      </div>

      <div class="menu" id="menu-main">
        <button class="btn primary" data-act="cpu">⚔ CPUと対戦</button>
        <button class="btn online" data-act="online">🌐 オンライン対戦</button>
        <button class="btn challenge" data-act="challenge">🏰 チャレンジ（ボス戦）</button>
        <div class="row4">
          <button class="btn ghost" data-act="deck"><b>🗂</b>デッキ</button>
          <button class="btn ghost" data-act="dex"><b>🃏</b>図鑑</button>
          <button class="btn ghost" data-act="rules"><b>📖</b>ルール</button>
          <button class="btn ghost" data-act="settings"><b>⚙</b>設定</button>
        </div>
      </div>

      <div class="menu hidden" id="menu-cpu">
        <p class="menu-label">難易度をえらぶ</p>
        <button class="btn diff easy" data-diff="easy">やさしい<small>はじめての人に</small></button>
        <button class="btn diff normal" data-diff="normal">ふつう<small>ちゃんと考えてくる</small></button>
        <button class="btn diff hard" data-diff="hard">つよい<small>容赦なし</small></button>
        <button class="btn ghost" data-act="back">← もどる</button>
      </div>

      <div class="menu hidden" id="menu-challenge">
        <p class="menu-label">ボスを倒してカード裏面を集めよう <span id="stage-count"></span></p>
        <div class="stage-list" id="stage-list"></div>
        <button class="btn ghost" data-act="back">← もどる</button>
      </div>

      <div class="menu hidden" id="menu-online">
        <p class="menu-label">はなれた友だちと通信で対戦</p>
        <button class="btn primary" id="mp-create-open">🏠 部屋を作る</button>
        <button class="btn" id="mp-join-open">🔢 番号で参加</button>
        <button class="btn ghost" id="mp-rank-open">🏆 ランキング</button>
        <p class="menu-label small" id="mp-myrate"></p>
        <button class="btn ghost" data-act="back">← もどる</button>
      </div>

      <div class="menu hidden" id="mp-create">
        <p class="menu-label">部屋を作る</p>
        <label class="field">なまえ<input id="mp-name-c" maxlength="10" autocomplete="nickname" placeholder="例：じゅん"></label>
        <button class="btn primary" id="mp-create-go">作る</button>
        <p class="mp-msg" id="mp-create-msg"></p>
        <button class="btn ghost" data-online-back>← もどる</button>
      </div>

      <div class="menu hidden" id="mp-join">
        <p class="menu-label">番号で参加</p>
        <label class="field">部屋番号<input id="mp-code" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4ケタ"></label>
        <label class="field">なまえ<input id="mp-name-j" maxlength="10" autocomplete="nickname" placeholder="例：じゅん"></label>
        <button class="btn primary" id="mp-join-go">参加する</button>
        <button class="btn" id="mp-join-watch">👀 観戦で入る</button>
        <p class="mp-msg" id="mp-join-msg"></p>
        <button class="btn ghost" data-online-back>← もどる</button>
      </div>

      <div class="record" id="record"></div>
      <p class="copyright">© 中濱Games</p>
    </div>
  </section>

  <!-- ===== 待合室（オンライン） ===== -->
  <section id="lobby" class="screen">
    <div class="lobby-inner">
      <p class="menu-label">部屋番号</p>
      <div class="tiles" id="mp-tiles"></div>
      <div class="invite">
        <div class="qr" id="mp-qr"></div>
        <div class="invite-side">
          <p>相手に番号を伝えるか、<br>カメラでQRを読んでもらおう</p>
          <button class="btn small" id="mp-share">📨 招待リンクを送る</button>
        </div>
      </div>
      <ul class="players" id="mp-players"></ul>
      <button class="btn primary" id="mp-start">⚔ 対戦スタート</button>
      <button class="btn small" id="mp-spec">👀 観戦にまわる</button>
      <p class="mp-msg info" id="lobby-msg"></p>
      <button class="btn ghost" id="mp-leave">部屋を出る</button>
    </div>
  </section>

  <!-- ===== 対戦画面 ===== -->
  <section id="game" class="screen">
    <div class="board" id="board">
      <div class="side top" id="side-top">
        <div class="pbar">
          <div class="pname" id="top-name"></div>
          <div class="pstat">
            <span class="royal" id="top-royal"></span>
            <span class="handc" id="top-hand"></span>
            <button class="pile" id="top-deck" title="山札">🂠 <b>0</b></button>
            <button class="pile" id="top-grave" title="墓地">🪦 <b>0</b></button>
          </div>
        </div>
        <div class="zone mana" id="top-mana"></div>
        <div class="zone shields" id="top-shields"></div>
        <div class="zone battle" id="top-battle"></div>
        <div class="hand-tag" id="top-handtag"></div>
      </div>

      <div class="mid">
        <div class="mid-info">
          <div class="turn-no"><span id="turn-no">TURN 1</span> <span class="timer" id="timer"></span></div>
          <div class="hint" id="hint"></div>
        </div>
        <div class="mid-btns">
          <button class="iconbtn hidden" id="btn-stamp" title="スタンプ">😀</button>
          <button class="iconbtn" id="btn-log" title="ログ">📜</button>
          <button class="iconbtn" id="btn-menu" title="メニュー">⚙</button>
          <button class="btn end" id="btn-end" disabled>ターン終了</button>
        </div>
      </div>

      <div class="side bot" id="side-bot">
        <div class="zone battle" id="bot-battle"></div>
        <div class="hand-tag" id="bot-handtag"></div>
        <div class="zone shields" id="bot-shields"></div>
        <div class="zone mana" id="bot-mana"></div>
        <div class="pbar">
          <div class="pname" id="bot-name"></div>
          <div class="pstat">
            <span class="royal" id="bot-royal"></span>
            <button class="pile" id="bot-deck" title="山札">🂠 <b>0</b></button>
            <button class="pile" id="bot-grave" title="墓地">🪦 <b>0</b></button>
          </div>
        </div>
      </div>
      <div class="hand" id="bot-hand"></div>
    </div>

    <aside class="log" id="log"><div class="log-head">バトルログ <button class="iconbtn" id="log-close">✕</button></div><div class="log-body" id="log-body"></div></aside>
    <div class="stamp-bar hidden" id="stamp-bar"></div>
    <div class="toast-wrap" id="toasts"></div>
  </section>

  <canvas id="fx-canvas"></canvas>
  <div id="fx-layer"></div>
  <div id="modal-root"></div>

  <script src="lib/qrcode.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
