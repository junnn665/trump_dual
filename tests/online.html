<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>オンライン対戦テスト（通信なし）</title>
<style>
  body { margin: 0; background: #111; display: flex; gap: 8px; padding: 8px; }
  iframe { width: 390px; height: 780px; border: 0; background: #000; }
</style>
</head>
<body>
<!-- 1台のブラウザの中で、本物の通信の代わりにメモリ上のデータベースで3人分の画面をつなぐ -->
<script type="module">
  import { createFakeNet } from './fakenet.js';
  window.FAKE_NET = createFakeNet({ latency: 30 });
  for (const id of (new URLSearchParams(location.search).get('ids') || 'alice,bob,carol').split(',')) {
    const f = document.createElement('iframe');
    f.id = id;
    f.src = `../index.html?pid=${id}`;
    document.body.appendChild(f);
  }
</script>
</body>
</html>
